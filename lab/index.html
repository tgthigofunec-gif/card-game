<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Memory Card — Dev Lab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">DEV LAB · MINI GAME</p>
        <h1>Memory <span>Cards</span></h1>
        <p class="subtitle">Encontre os pares e teste sua memória de dev.</p>
      </div>
      <div class="stats" aria-live="polite">
        <div><span class="stat-label">MOVIMENTOS</span><strong id="moves">0</strong></div>
        <div><span class="stat-label">TEMPO</span><strong id="time">00:00</strong></div>
      </div>
    </header>
    <section class="toolbar">
      <p id="status" role="status">Vire duas cartas para começar.</p>
      <button id="restart" type="button">↻ Reiniciar</button>
    </section>
    <section id="board" class="board" aria-label="Tabuleiro do jogo da memória"></section>
    <footer>Feito com <b>HTML</b>, <b>CSS</b> e <b>JavaScript</b> · 8 pares de ícones de programação</footer>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
